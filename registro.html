<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiftStore | Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a class="marca" href="index.html" aria-label="LiftStore"><img src="assets/logo.png" alt="Logo de LiftStore"></a>
            <div class="enlaces-navegacion">
                <a href="index.html">Inicio</a>
                <a href="equipamiento.html">Equipamiento</a>
                <a href="ropa-deportiva.html">Ropa deportiva</a>
                <a href="accesorios.html">Accesorios</a>
                <a href="nutricion.html">Nutrición</a>
                <a href="login.html">Iniciar sesión</a>
                <a href="registro.html">Registrarse</a>
                <a class="cerrar-sesion" href="index.html">Cerrar sesión</a>
            </div>
        </nav>
    </header>
    <main class="container container-autenticacion">
        <section class="caja-formulario">
            <h1>Crear una cuenta</h1>
            <form action="#" method="post">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
                <label for="fecha-nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
                <button type="submit">Registrarme</button>
            </form>
            <p class="nota-formulario">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>.</p>
        </section>
    </main>
</body>
</html>
