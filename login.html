<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiftStore | Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/logo.png" type="image/png" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <a class="marca" href="index.html" aria-label="LiftStore"
          ><img src="assets/logo.png" alt="Logo de LiftStore"
        /></a>
        <div class="enlaces-navegacion">
          <a href="index.html">Inicio</a>
          <a href="equipamiento.html">Equipamiento</a>
          <a href="ropa-deportiva.html">Ropa deportiva</a>
          <a href="accesorios.html">Accesorios</a>
          <a href="nutricion.html">Nutrición</a>
          <a href="login.html">Iniciar sesión</a>
          <a href="registro.html">Registrarse</a>
          <a class="cerrar-sesion" href="index.html">Cerrar sesión</a>
        </div>
      </nav>
    </header>
    <main class="container container-autenticacion">
      <section class="caja-formulario">
        <h1>
          <svg class="icono-formulario" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
            <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/>
            <path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
          </svg>
          Iniciar sesión
        </h1>
        <form action="#" method="post">
          <label for="email">
            <svg class="icono-campo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
              <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"/>
            </svg>
            Email
          </label>
          <input type="email" id="email" name="email" required />
          <label for="password">
            <svg class="icono-campo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
              <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1"/>
            </svg>
            Contraseña
          </label>
          <input type="password" id="password" name="password" required />
          <button type="submit">Ingresar</button>
        </form>
        <p class="nota-formulario">
          ¿No tenés cuenta? <a href="registro.html">Registrate acá</a>.
        </p>
      </section>
    </main>
  </body>
</html>
